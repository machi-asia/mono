name: OtaKit OTA Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/otakit-ota.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "Target OtaKit Channel (leave empty for base stream)"
        required: false
        default: ""
        type: string

concurrency:
  group: otakit-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-ota:
    name: Build & Deploy OTA Bundles
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ota]')"
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: calculator
            path: apps/calculator
            app_id: bcbdb078-9e02-4744-98dd-44afd20505c4
          - name: docs
            path: apps/docs
            app_id: b4cb8036-75d2-45f1-ac52-3de7904869b3
          - name: hells-forge
            path: apps/hells-forge
            app_id: 36660daa-e552-4410-9afb-fc6320b592cc
          - name: machi-asia
            path: apps/machi-asia
            app_id: 3ad8cf40-58d9-4124-b82a-079df5524596
          - name: rose
            path: apps/rose
            app_id: 717836e1-e934-42de-b027-0a5061173bcb
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Export for ${{ matrix.app.name }}
        run: npm --workspace=@mono/${{ matrix.app.name == 'machi-asia' && 'machi-asia' || matrix.app.name == 'rose' && 'rose-app' || matrix.app.name == 'calculator' && 'calculator-app' || matrix.app.name }} run build:mobile
        env:
          NEXT_PUBLIC_SITE_URL: "https://machi.asia"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload OTA Bundle to OtaKit (${{ matrix.app.name }})
        run: |
          npx -y @otakit/cli@latest upload ${{ matrix.app.path }}/out \
            --app-id ${{ matrix.app.app_id }} \
            --release ${{ github.event.inputs.channel }} \
            --ignore-compat
        env:
          OTAKIT_TOKEN: ${{ secrets.OTAKIT_TOKEN }}
